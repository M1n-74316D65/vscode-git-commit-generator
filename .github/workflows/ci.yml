name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode-version: ["1.90.0", "stable"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: bun run compile

      - name: Run extension-host tests
        run: xvfb-run -a bun run test
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}

      - name: Check whitespace
        run: git diff --check

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package VSIX
        run: bun run package:vsix

      - name: Verify VSIX
        run: bun scripts/verify-vsix.mjs

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: git-commit-generator-vsix
          path: artifacts/vsix/git-commit-generator.vsix
          retention-days: 30
