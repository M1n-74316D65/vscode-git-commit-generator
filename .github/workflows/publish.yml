name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: bun run compile

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#v}" = "$(bun -p "require('./package.json').version")"

      - name: Run extension-host tests
        run: xvfb-run -a bun run test

      - name: Package VSIX artifact
        run: bun run package:vsix

      - name: Verify VSIX
        run: bun scripts/verify-vsix.mjs

      - name: Publish to VS Code Marketplace
        run: bunx vsce publish -i artifacts/vsix/git-commit-generator.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: git-commit-generator-${{ github.ref_name }}
          path: artifacts/vsix/git-commit-generator.vsix
          retention-days: 30
